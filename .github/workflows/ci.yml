name: QStudy checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qstudy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-qstudy-test-secret-at-least-32-characters
      GEMINI_API_KEY: ''
      SMTP_PASSWORD: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Check repository files
        run: python scripts/check_repository.py
      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: node --test lib/learning-selection.test.mjs lib/syllabus-draft.test.mjs lib/branding.test.mjs lib/branding-store.test.mjs
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
