name: QStudy checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qstudy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-qstudy-test-secret-at-least-32-characters
      GEMINI_API_KEY: ''
      SMTP_PASSWORD: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Check repository files
        run: python scripts/check_repository.py
      - name: Windows home hosting checks
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/production/Test-QStudyWindowsHost.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-QStudyHomeNetwork.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-QStudyDuckDNS.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/production/Test-QStudyHostSetup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/production/Test-QStudyHostWizard.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-QStudyPortMapping.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-QStudyPublicAccess.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-QStudyPublicPortOwner.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/production/Test-QStudyInternetLaunch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: node --test lib/*.test.mjs
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate production scripts and prepare disposable configuration
        run: |
          bash -n scripts/production/Install-Docker.sh scripts/production/Manage-QStudy.sh
          python3 -m unittest discover -s backend/tests -p test_production_configuration.py
          python3 scripts/production/configure.py init qstudy-ci.example.org owner@example.org
          # Only this disposable installation permits the smoke-test sign-up.
          sed -i "s/^REGISTRATION_ENABLED='false'$/REGISTRATION_ENABLED='true'/" deployment/.env
          python3 scripts/production/configure.py check --offline
          sudo python3 scripts/production/configure.py permissions
          docker compose --env-file deployment/.env -f deployment/compose.yml config --quiet
      - name: Build Linux production images
        run: docker compose --env-file deployment/.env -f deployment/compose.yml build
      - name: Validate HTTPS proxy configuration
        run: docker compose --env-file deployment/.env -f deployment/compose.yml run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify native Linux OCR using synthetic documents
        run: |
          docker run --rm -e QSTUDY_REAL_OCR_TEST=1 -e SECRET_KEY=ci-only-qstudy-test-secret-at-least-32-characters -v "$PWD/backend/tests:/tests:ro" qstudy-backend:local python -m unittest discover -s /tests -p test_linux_pdf_ocr.py
      - name: Check production authentication and persistence
        run: |
          docker compose --env-file deployment/.env -f deployment/compose.yml up -d --wait --wait-timeout 300 backend frontend
          docker compose --env-file deployment/.env -f deployment/compose.yml exec -T frontend node --input-type=module < scripts/production/smoke.mjs
          docker compose --env-file deployment/.env -f deployment/compose.yml exec -T backend python production_runtime.py backup
          docker compose --env-file deployment/.env -f deployment/compose.yml restart backend
          docker compose --env-file deployment/.env -f deployment/compose.yml up -d --wait --wait-timeout 300 backend frontend
          docker compose --env-file deployment/.env -f deployment/compose.yml exec -T frontend node --input-type=module - --existing < scripts/production/smoke.mjs
      - name: Verify direct HTTP IP and port hosting
        run: |
          # Only the disposable CI project changes mode; existing database/uploads
          # remain in place to verify that account data survives that transition.
          docker compose --env-file deployment/.env -f deployment/compose.yml stop
          mv deployment/.env deployment/.env.ci-https
          # The existing Linux data directories already belong to the app UID.
          # Initialize/check as root, but keep the private dotenv readable by the
          # CI runner that invokes Compose. Data ownership remains unchanged.
          sudo python3 scripts/production/configure.py init-http 8.8.8.8 18080
          sudo chown "$(id -u):$(id -g)" deployment/.env
          sudo python3 scripts/production/configure.py check --offline
          sudo python3 scripts/production/configure.py permissions
          if sudo bash scripts/production/Manage-QStudy.sh check --offline; then
            echo 'Legacy Linux HTTPS manager must refuse HTTP mode'
            exit 1
          fi
          docker compose --env-file deployment/.env -f deployment/compose.http.yml config --quiet
          docker compose --env-file deployment/.env -f deployment/compose.http.yml run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose --env-file deployment/.env -f deployment/compose.http.yml up -d --no-build --force-recreate --wait --wait-timeout 300 backend frontend caddy
          python3 scripts/production/configure.py probe --local
          docker compose --env-file deployment/.env -f deployment/compose.http.yml exec -T backend python production_runtime.py account-status
          docker compose --env-file deployment/.env -f deployment/compose.http.yml exec -T frontend node --input-type=module - --existing < scripts/production/smoke.mjs
          # 8.8.8.8 is only a synthetic configured Host/Origin. All connections
          # below use loopback; no test ever contacts that public IPv4.
          python3 - <<'PY'
          import http.client
          import json
          import subprocess
          import urllib.parse

          authority = "8.8.8.8:18080"
          origin = "http://" + authority
          compose = ["docker", "compose", "--env-file", "deployment/.env", "-f", "deployment/compose.http.yml"]
          for service in ("backend", "frontend", "caddy"):
              container = subprocess.check_output(compose + ["ps", "-q", service], text=True).strip()
              assert container, f"{service} is running"
              ports = json.loads(subprocess.check_output(["docker", "inspect", "--format", "{{json .NetworkSettings.Ports}}", container], text=True))
              published = {port: bindings for port, bindings in (ports or {}).items() if bindings}
              if service == "caddy":
                  assert set(published) == {"80/tcp"}, "HTTP mode publishes neither HTTPS nor unrelated ports"
                  assert all(binding["HostPort"] == "18080" for binding in published["80/tcp"])
              else:
                  assert not published, f"{service} stays on private container networks"

          def request(path, host=authority, method="GET", body=None, extra=None):
              headers = {"Host": host, **(extra or {})}
              connection = http.client.HTTPConnection("127.0.0.1", 18080, timeout=30)
              try:
                  connection.request(method, path, body=body, headers=headers)
                  response = connection.getresponse()
                  data = response.read(2 * 1024 * 1024 + 1)
                  assert len(data) <= 2 * 1024 * 1024, "Proxy response remains bounded"
                  return response.status, dict(response.getheaders()), data
              finally:
                  connection.close()

          for path in ("/api/health", "/"):
              status, headers, data = request(path)
              assert status == 200, f"HTTP proxy serves {path}"
              assert not any(key.lower() == "strict-transport-security" for key in headers), "HTTP mode has no HTTPS-only HSTS policy"
              if path == "/api/health":
                  assert json.loads(data)["service"] == "QStudy"
              else:
                  assert b"QStudy" in data
          for host in ("8.8.8.8", "8.8.8.8:18081", "other.example.org:18080", "127.0.0.1:18080"):
              assert request("/api/health", host=host)[0] == 421, "Proxy rejects unconfigured authorities, including a wrong port"
          payload = urllib.parse.urlencode({"username": "deployment-ci@example.org", "password": "QStudyDisposableCi2026!"})
          status, headers, data = request("/api/auth/login", method="POST", body=payload, extra={"Origin": origin, "Content-Type": "application/x-www-form-urlencoded"})
          assert status == 200, "Existing student account works through the public HTTP proxy"
          cookie = next(value for key, value in headers.items() if key.lower() == "set-cookie")
          attributes = {part.strip().lower() for part in cookie.split(";")[1:]}
          assert "httponly" in attributes and "samesite=strict" in attributes and "secure" not in attributes, "HTTP session retains script/CSRF protections with the explicit HTTP cookie mode"
          assert request("/api/auth/me", extra={"Cookie": cookie.split(";", 1)[0]})[0] == 200
          assert request("/api/auth/login", method="POST", body=payload, extra={"Origin": "https://evil.example", "Content-Type": "application/x-www-form-urlencoded"})[0] == 403
          print("Direct HTTP proxy, exact Host/port, private ports, cookie and persisted-account checks passed.")
          PY
      - name: Stop disposable services
        if: always()
        run: |
          if test -f deployment/.env; then
            if grep -q "^QSTUDY_HOST_MODE='http'$" deployment/.env; then
              docker compose --env-file deployment/.env -f deployment/compose.http.yml stop
            else
              docker compose --env-file deployment/.env -f deployment/compose.yml stop
            fi
          fi
