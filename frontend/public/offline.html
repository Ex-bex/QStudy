<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#25252b">
    <meta name="robots" content="noindex">
    <title>Нет подключения · QForce</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f7f6f2; color: #25252b; font-family: system-ui, sans-serif; }
      main { max-width: 430px; text-align: center; }
      .mark { display: grid; place-items: center; width: 66px; height: 66px; margin: 0 auto 28px; border-radius: 20px; background: #25252b; color: white; font-size: 32px; font-weight: 700; }
      h1 { font-size: clamp(24px, 5vw, 32px); letter-spacing: -.04em; }
      p { color: #67676d; line-height: 1.65; }
      a { display: inline-block; padding: 13px 22px; margin-top: 16px; border-radius: 12px; background: #25252b; color: white; text-decoration: none; }
      a:focus-visible { outline: 3px solid #607a52; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">Q</div>
      <h1>Нет подключения</h1>
      <p>Проверьте интернет и повторите попытку. Для работы с сообщениями, учебными материалами и аккаунтом нужно подключение к серверу.</p>
      <a href="">Повторить</a>
    </main>
  </body>
</html>
